name: Build APK

on:
  push:
    branches: [main]
    # Jangan build ulang jika hanya dokumentasi atau backend yang berubah
    paths-ignore:
      - '**.md'
      - 'Code.gs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Bangun APK dan Rilis
    runs-on: ubuntu-24.04

    steps:
      # 1. Ambil kode
      - name: Checkout Kode
        uses: actions/checkout@v4

      # 2. Node.js dengan cache (package-lock.json sudah ada)
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Java 17 (dibutuhkan Capacitor 6)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Terima lisensi Android SDK bawaan runner
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 5. Pasang dependensi
      - name: Install dependensi
        run: npm ci

      # 6. Build web (hasil di folder dist)
      - name: Build web
        run: npm run build

      # 7. Buat proyek Android jika belum ada di repo
      - name: Tambahkan platform Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # 8. Salin hasil build web ke proyek Android
      - name: Sinkronisasi Capacitor
        run: npx cap sync android

      # 9. Bangun APK debug
      - name: Bangun APK dengan Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 10. Beri nama file APK
      - name: Ganti nama APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "DigiSwiss-v1.0.${{ github.run_number }}.apk"

      # 11. Simpan sebagai artifact (cadangan)
      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiswiss-apk
          path: DigiSwiss-v1.0.${{ github.run_number }}.apk
          retention-days: 14

      # 12. Buat Release dan lampirkan APK
      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DigiSwiss v1.0.${{ github.run_number }}
          body: |
            APK otomatis dari commit ${{ github.sha }}.
            Unduh file .apk di bagian Assets, lalu pasang di HP Android
            (aktifkan "Pasang dari sumber tidak dikenal" jika diminta).
          files: DigiSwiss-v1.0.${{ github.run_number }}.apk
          make_latest: true
